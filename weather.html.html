
<!DOCTYPE html>
<html>
<head>
    <title>Weather Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #weather {
            margin-top: 20px;
            text-align: left;
        }

        #weather p {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 5px;
        }

        h1 {
            color: #1e293b;
        }
    </style>
</head>

<body>

    <h1>Weather Information</h1>

    <div class="container">

        <input type="text" id="city" placeholder="Enter a city name">

        <button onclick="GetData()">Get Data</button>

        <div id="weather"></div>

    </div>

    <script>

        function GetData() {

            let place = document.getElementById("city").value;

            if (place.trim() === "") {
                alert("Please enter a city name");
                return;
            }

            fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=en&format=json`)

            .then(response => response.json())

            .then(data => {

                if (!data.results || data.results.length === 0) {
                    document.getElementById("weather").innerHTML = "City not found";
                    return;
                }

                let longitude = data.results[0].longitude;
                let latitude = data.results[0].latitude;

                weather_details(longitude, latitude);

            })

            .catch(error => console.log(error));
        }


        function weather_details(lo, la) {

            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`)

            .then(response => response.json())

            .then(data => {

                document.getElementById("weather").innerHTML = `

                    <h3>Current Weather</h3>

                    <p>Temperature: ${data.current.temperature_2m} °C</p>

                    <p>Humidity: ${data.current.relative_humidity_2m} %</p>

                    <p>Wind Speed: ${data.current.wind_speed_10m} km/h</p>

                `;

            })

            .catch(error => console.log(error));

        }

    </script>

</body>
</html>
